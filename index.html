<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大无垠战机 · Big Infinity Fighter</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <div class="game-sizer">
      <div class="game-wrap">
        <header class="title-bar hidden">
      <h1>大无垠战机</h1>
      <span class="subtitle">Big Infinity Fighter</span>
    </header>

    <!-- 音乐 / 音效开关：骑在游戏画面右上角上、向外超出（negative offset 悬挂于框角），
         主菜单 / 暂停 / 结算时仍可见可点 -->
    <button id="musicToggle" class="music-toggle" title="音乐 / 音效开关" aria-label="音乐 / 音效开关">
        <svg class="mt-icon mt-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
        </svg>
        <svg class="mt-icon mt-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <line x1="22" y1="9" x2="16" y2="15" />
          <line x1="16" y1="9" x2="22" y2="15" />
        </svg>
      </button>

    <div class="stage">
      <canvas id="game" width="480" height="792"></canvas>

      <!-- HUD -->
      <div class="hud">
        <div class="hud-left">
          <div class="score-panel">
            <span class="score-label">SCORE</span>
            <b id="scoreText">0</b>
          </div>
          <!-- 当前难度标签（战斗中显示；buildDiffCards 难度注册表驱动） -->
          <div class="diff-label hidden" id="diffLabel"></div>
        </div>
        <div class="hud-right">
          <!-- 高能爆弹：图标数量代表爆弹数（上限 3，BOSS 测试模式 ∞），由 updateHUD 渲染 -->
          <div class="bomb-icons" id="bombIcons" title="高能爆弹（Space 释放）"></div>
        </div>
      </div>

      <!-- 左下角：装甲技能量表（七日澜心） + 驾驶员量表（天秀忧郁王子） + 心心 + HP 条 -->
      <div class="hud-bl">
        <!-- 护甲技能圆形计数表（七日澜心专属；按填充角度统计量表，满后按 F 触发） -->
        <div class="skill-gauge hidden" id="skillGauge" title="护甲技能量表：满后按 F 释放">
          <div class="skill-gauge-ring" id="skillGaugeRing"></div>
          <span class="skill-gauge-key">F</span>
        </div>
        <!-- 驾驶员量表（天秀忧郁王子白色量表 / 陵落 Q 冷却，均按 Q，按键标签随驾驶员切换） -->
        <div class="skill-gauge pilot-gauge hidden" id="pilotGauge" title="驾驶员量表">
          <div class="skill-gauge-ring" id="pilotGaugeRing"></div>
          <span class="skill-gauge-key" id="pilotGaugeKey">E</span>
        </div>
        <!-- 大无垠之王：BOSS 战累积增伤读数（位于血条上方、量表之下，flex 列排布不与量表重叠；向上取整整数百分比） -->
        <div class="king-bonus hidden" id="kingBonus" title="大无垠之王：BOSS 战累积增伤（怒意蔓延）"></div>
        <div class="hp-row">
          <span class="lives-text" id="livesText">♥♥</span>
          <div class="hp-bar">
            <div class="hp-fill" id="hpFill"></div>
          </div>
        </div>
      </div>

      <!-- 右下角：暴走 / 护盾 / 昂扬 / 晶盾 倒计时读条（文字居右） -->
      <div class="hud-br">
        <div class="buff-bar berserk-bar" id="berserkBar">
          <div class="buff-track"><div class="buff-fill" id="berserkFill"></div></div>
          <span class="buff-tag">暴走</span>
        </div>
        <div class="buff-bar shield-bar" id="shieldBar">
          <div class="buff-track"><div class="buff-fill" id="shieldFill"></div></div>
          <span class="buff-tag">护盾</span>
        </div>
        <div class="buff-bar douzhi-bar" id="douzhiBar">
          <div class="buff-track"><div class="buff-fill" id="douzhiFill"></div></div>
          <span class="buff-tag">昂扬</span>
        </div>
        <div class="buff-bar jingdun-bar" id="jingdunBar">
          <div class="buff-track"><div class="buff-fill" id="jingdunFill"></div></div>
          <span class="buff-tag">晶盾</span>
        </div>
      </div>

      <!-- 主菜单（独立页面态）：idle 时全屏显示，进入战斗隐藏。
           自上而下一屏完成（不可滚动）：标题 → 攻击演示屏（画布 15%~66% 区域，
           选中战机+僚机固定居中、自动循环 Lv4 5s ↔ 暴走 5s 攻击演示）→
           装备四框（战机/护甲/副武器占位/僚机，点击展开选择面板覆盖演示屏）→
           底部（难度切换 + 开始游戏 | 怪物图鉴 | 右下角 ⓘ 数值与机制图鉴） -->
      <div class="menu-screen hidden" id="menuScreen">
        <!-- 版本号：主菜单右上角（与 package.json / README 版本保持同步） -->
          <span class="menu-version">v0.3.4</span>
        <!-- 操作提示：左上角 ? 按钮，点击展开 / 收起按键说明卡片 -->
        <button class="help-entry-btn" id="helpEntryBtn" title="游戏操作按键" aria-label="游戏操作按键">?</button>
        <div class="help-panel hidden" id="helpPanel">
          <div class="help-head">
            <span class="help-title">游戏操作</span>
            <button class="help-close" id="helpClose" aria-label="收起">✕</button>
          </div>
          <div class="help-row"><span class="help-keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span class="help-desc">移动战机（支持方向键）</span></div>
          <div class="help-row"><span class="help-keys"><kbd>Space</kbd></span><span class="help-desc">高能爆弹：清除全部敌弹 + 全场伤害</span></div>
          <div class="help-row"><span class="help-keys"><kbd>P</kbd></span><span class="help-desc">暂停 / 继续</span></div>
          <div class="help-row"><span class="help-keys"><kbd>R</kbd></span><span class="help-desc">立即重开</span></div>
          <div class="help-row"><span class="help-keys"><kbd>F</kbd></span><span class="help-desc">装甲技能</span></div>
          <div class="help-row"><span class="help-keys"><kbd>Q</kbd></span><span class="help-desc">副驾驶员技能</span></div>
        </div>

        <div class="menu-hero">
          <h1 class="menu-title">大无垠战机</h1>
          <span class="menu-subtitle">BIG INFINITY FIGHTER</span>
        </div>

        <!-- 攻击演示屏：DOM 仅绘制边框与轻底色，机体 / 弹道 / 暴走动画由画布绘制（07-player updateDemo 驱动） -->
        <div class="demo-screen" id="demoScreen"></div>

        <!-- 装备区：战机（高框含形象）| 护甲 + 副武器 + 驾驶员菱形（占位）| 僚机（高框含形象） -->
        <div class="loadout-row">
          <button class="loadout-box loadout-tall" data-panel="panelPlane">
            <span class="loadout-label">战机</span>
            <span class="loadout-value" id="loadoutPlaneVal"></span>
            <canvas class="loadout-thumb" id="loadoutPlaneCvs" width="92" height="76"></canvas>
          </button>
          <div class="loadout-cluster">
            <button class="loadout-box loadout-quad" data-panel="panelArmor">
              <span class="loadout-label">护甲</span>
              <span class="loadout-value" id="loadoutArmorVal"></span>
              <span class="loadout-armor-glyph" id="loadoutArmorGlyph"></span>
            </button>
            <button class="loadout-box loadout-quad" data-panel="panelSub">
              <span class="loadout-label">副武器</span>
              <span class="loadout-value" id="loadoutSubVal">无界飞剑</span>
              <span class="loadout-sub-glyph" id="loadoutSubGlyph"></span>
            </button>
            <!-- 驾驶员菱形框：点击展开驾驶员选择面板（卡片由 12-ui buildPilotCards 按 PILOTS 注册表生成）；
                 文字样式复用装备框的 label / value 类 -->
            <button class="pilot-diamond" data-panel="panelPilot" title="主驾驶员：无／副驾驶员：无">
              <span class="pilot-face">
                <span class="loadout-label">驾驶员</span>
                <span class="loadout-value" id="loadoutPilotVal">无</span>
                <span class="loadout-value loadout-value-sm" id="loadoutPilotSubVal"></span>
              </span>
            </button>
          </div>
          <button class="loadout-box loadout-tall" data-panel="panelWingman">
            <span class="loadout-label">僚机</span>
            <span class="loadout-value" id="loadoutWingmanVal"></span>
            <canvas class="loadout-thumb" id="loadoutWingmanCvs" width="56" height="60"></canvas>
          </button>
        </div>

        <!-- 装备选择面板：展开时覆盖演示屏区域，展示目前已有的可选项 -->
        <div class="loadout-panel hidden" id="panelPlane">
          <div class="loadout-panel-head">
            <span class="loadout-panel-title">选择战机</span>
            <button class="panel-close" data-close="panelPlane" aria-label="收起">✕</button>
          </div>
          <div class="loadout-panel-body">
            <div class="plane-grid" id="planeGrid"></div>
          </div>
        </div>
        <div class="loadout-panel hidden" id="panelArmor">
          <div class="loadout-panel-head">
            <span class="loadout-panel-title">选择护甲</span>
            <button class="panel-close" data-close="panelArmor" aria-label="收起">✕</button>
          </div>
          <div class="loadout-panel-body">
            <div class="armor-grid" id="armorGrid"></div>
          </div>
        </div>
        <div class="loadout-panel hidden" id="panelSub">
          <div class="loadout-panel-head">
            <span class="loadout-panel-title">选择副武器</span>
            <button class="panel-close" data-close="panelSub" aria-label="收起">✕</button>
          </div>
          <div class="loadout-panel-body">
            <div class="armor-grid" id="subGrid"></div>
          </div>
        </div>
        <div class="loadout-panel hidden" id="panelPilot">
          <div class="loadout-panel-head">
            <span class="loadout-panel-title">选择驾驶员</span>
            <button class="panel-close" data-close="panelPilot" aria-label="收起">✕</button>
          </div>
          <div class="loadout-panel-body">
            <div class="pilot-slot-label">主驾驶员</div>
            <div class="armor-grid pilot-grid" id="pilotGridMain"></div>
            <div class="pilot-slot-label">副驾驶员</div>
            <div class="armor-grid pilot-grid" id="pilotGridSub"></div>
          </div>
        </div>
        <div class="loadout-panel hidden" id="panelWingman">
          <div class="loadout-panel-head">
            <span class="loadout-panel-title">选择僚机</span>
            <button class="panel-close" data-close="panelWingman" aria-label="收起">✕</button>
          </div>
          <div class="loadout-panel-body">
            <div class="plane-grid" id="wingmanGrid"></div>
          </div>
        </div>

        <!-- 底部：左侧难度切换（开始键上方）+ 大按钮开始游戏；右侧大按钮怪物图鉴 -->
        <div class="menu-bottom">
          <div class="menu-start-col">
            <div class="diff-grid" id="diffGrid"></div>
            <button id="menuStartBtn" class="menu-start-btn">开始游戏</button>
          </div>
          <div class="menu-right-col">
            <!-- 怪物图鉴入口（静态：12-ui 仅做显隐切换，不再动态创建） -->
            <button id="encyEntryBtn" class="ency-entry-btn">怪物图鉴</button>
            <!-- 数值与机制图鉴入口（ⓘ 圆钮）：与怪物图鉴按钮同排垂直居中 -->
            <button class="info-entry-btn" id="infoEntryBtn" title="数值与机制图鉴">i</button>
          </div>
        </div>
      </div>

      <!-- 暂停 / 结算遮罩（主菜单独立成页后，遮罩仅承担 暂停 / 失败 / 胜利 三种状态） -->
      <div class="overlay hidden" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">已暂停</h2>
          <p id="overlayDesc"></p>
          <!-- 获得成就区（仅胜利 / 失败结算页显示，暂停页隐藏）：标题居中，下方预留成就展示位（未实装） -->
          <div class="result-achieve hidden" id="resultAchieve">
            <div class="result-achieve-title">获得成就</div>
            <div class="result-achieve-area"></div>
          </div>
          <!-- 再次挑战置于上方：BOSS 试炼 / 图鉴挑战胜利页与「返回主界面」同时可见，挑战按钮在上 -->
          <button id="retrialBtn" class="hidden">再次挑战</button>
          <button id="startBtn">继续游戏</button>
          <button id="gameoverHomeBtn" class="hidden">返回主界面</button>
          <button id="pauseRetryBtn" class="hidden">重新挑战</button>
          <button id="pauseHomeBtn" class="hidden">返回主界面</button>
          <div class="boss-test-row" id="bossTestRow"></div>
        </div>
      </div>
      <!-- 怪物图鉴 -->
      <div class="encyclopedia hidden" id="encyclopedia">
        <div class="ency-header">
          <h2>怪物图鉴</h2>
          <!-- 快捷切换难度：三选一按钮组（静态标记，保证始终渲染；选中/置灰/提示由 13-encyclopedia 依 DIFFICULTIES 初始化） -->
          <div class="ency-diff-group" id="encyDiffGroup">
            <button class="ency-diff-btn" data-diff="xuxiang">虚象</button>
            <button class="ency-diff-btn" data-diff="juxiang">具象</button>
            <button class="ency-diff-btn" data-diff="zhenwo">真我</button>
          </div>
          <button class="ency-close" id="encyClose">✕</button>
        </div>
        <div class="ency-body">
          <div class="ency-tabs" id="encyTabs"></div>
          <div class="ency-content">
            <div class="ency-list" id="encyList"></div>
            <div class="ency-detail" id="encyDetail">
              <p class="ency-placeholder">← 选择一个敌人查看详情</p>
            </div>
          </div>
        </div>
      </div>
      <!-- 数值与机制图鉴 -->
      <div class="info-modal hidden" id="infoModal">
        <div class="info-header">
          <h2>数值与机制图鉴</h2>
          <button class="info-close" id="infoClose">✕</button>
        </div>
        <div class="info-tabs" id="infoTabs"></div>
        <div class="info-body" id="infoBody"></div>
      </div>
      </div>
      </div>
    </div>
  </div>

  <!-- 游戏脚本：ES modules，显式 import/export 声明依赖；按序号加载保持执行顺序（01 常量 → 14 启动入口），
       跨模块可变绑定（ctx / currentPlane / currentWingman）的写操作必须经由所有者模块暴露的 setter -->
  <script type="module" src="./js/01-config.js"></script>
  <script type="module" src="./js/02-achievements.js"></script>
  <script type="module" src="./js/02-core.js"></script>
  <script type="module" src="./js/03-audio.js"></script>
  <script type="module" src="./js/04-spawn.js"></script>
  <script type="module" src="./js/05-boss.js"></script>
  <script type="module" src="./js/06-enemy.js"></script>
  <script type="module" src="./js/07-player.js"></script>
  <script type="module" src="./js/08-entities.js"></script>
  <script type="module" src="./js/09-draw-ships.js"></script>
  <script type="module" src="./js/10-draw-world.js"></script>
  <script type="module" src="./js/11-draw-boss.js"></script>
  <script type="module" src="./js/12-ui.js"></script>
  <script type="module" src="./js/13-encyclopedia.js"></script>
  <script type="module" src="./js/14-main.js"></script>
</body>
</html>
